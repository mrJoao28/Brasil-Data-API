openapi: 3.0.3
info:
  title: Brazil Data API
  description: >
    Unified REST API that aggregates Brazilian public/free data sources
    (postal codes, IBGE geographic data, national holidays and CNPJ company
    lookups) behind a single, consistent JSON interface.
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: https://brasil-data-api.onrender.com
    description: Production
  - url: http://localhost:3000
    description: Local development

security:
  - ApiKeyAuth: []

tags:
  - name: Health
  - name: CEP
  - name: Locations
  - name: Holidays
  - name: CNPJ
  - name: Metrics

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/cep/{cep}:
    get:
      tags: [CEP]
      summary: Look up an address by Brazilian postal code (CEP)
      parameters:
        - name: cep
          in: path
          required: true
          description: 8-digit CEP, with or without a hyphen (e.g. "69000000" or "69000-000")
          schema:
            type: string
            example: '69000000'
      responses:
        '200':
          description: Address found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CepResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/states:
    get:
      tags: [Locations]
      summary: List all Brazilian states
      responses:
        '200':
          description: List of states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/states/{uf}/cities:
    get:
      tags: [Locations]
      summary: List cities (municipalities) for a given state
      parameters:
        - name: uf
          in: path
          required: true
          description: 2-letter state code (e.g. "AM")
          schema:
            type: string
            example: AM
      responses:
        '200':
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CityResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/holidays/{year}:
    get:
      tags: [Holidays]
      summary: List Brazilian national holidays for a given year
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
            example: 2026
      responses:
        '200':
          description: List of holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HolidayResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/cnpj/{cnpj}:
    get:
      tags: [CNPJ]
      summary: Look up a company by CNPJ
      description: Returns normalized company registration data, including address and business activity information.
      parameters:
        - name: cnpj
          in: path
          required: true
          description: >
            14-digit CNPJ, with or without formatting punctuation. Check
            digits ("dígitos verificadores") are validated; a
            structurally 14-digit but arithmetically invalid CNPJ is
            rejected with 400 VALIDATION_ERROR.
          schema:
            type: string
            example: '19131243000197'
      responses:
        '200':
          description: Company found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CnpjResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/empresa-completa/{cnpj}:
    get:
      tags: [CNPJ]
      summary: Look up and enrich a company by CNPJ
      description: >
        Returns normalized company registration data together with a full CEP
        address lookup and full state information when those secondary
        lookups are available. Secondary failures are reported in warnings
        instead of failing the whole request.
      parameters:
        - name: cnpj
          in: path
          required: true
          description: >
            14-digit CNPJ, with or without formatting punctuation. Check
            digits ("dígitos verificadores") are validated; a
            structurally 14-digit but arithmetically invalid CNPJ is
            rejected with 400 VALIDATION_ERROR.
          schema:
            type: string
            example: '19131243000197'
      responses:
        '200':
          description: Company found (address/state may be null; see warnings)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaCompletaResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/metrics:
    get:
      tags: [Metrics]
      summary: Get API usage and performance metrics
      description: >
        Returns in-memory request, error, latency and cache statistics for
        the running API instance. Metrics are reset when the process restarts.
      responses:
        '200':
          description: Current API metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        uptimeSeconds:
          type: integer
        timestamp:
          type: string
          format: date-time

    CepResponse:
      type: object
      properties:
        cep:
          type: string
          example: '69000000'
        street:
          type: string
        neighborhood:
          type: string
        city:
          type: string
          example: Manaus
        state:
          type: string
          example: Amazonas
        stateCode:
          type: string
          example: AM

    StateResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Amazonas
        stateCode:
          type: string
          example: AM
        region:
          type: string
          example: Norte

    CityResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Manaus
        stateCode:
          type: string
          example: AM

    HolidayResponse:
      type: object
      properties:
        date:
          type: string
          example: '2026-01-01'
        name:
          type: string
          example: Confraternização mundial
        type:
          type: string
          example: national

    SecondaryActivity:
      type: object
      properties:
        code:
          type: integer
          example: 6201501
        description:
          type: string
          example: Desenvolvimento de programas de computador sob encomenda

    CnpjResponse:
      type: object
      properties:
        cnpj:
          type: string
          example: '19131243000197'
        legalName:
          type: string
        tradeName:
          type: string
          nullable: true
        status:
          type: string
        openedAt:
          type: string
          nullable: true
          example: '1988-08-17'
        mainActivity:
          type: string
          nullable: true
        mainActivityCode:
          type: integer
          nullable: true
        secondaryActivities:
          type: array
          items:
            $ref: '#/components/schemas/SecondaryActivity'
        legalNature:
          type: string
          nullable: true
        companySize:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
          example: AM
        cep:
          type: string
          nullable: true
          description: Company's registered CEP, digits only.
        street:
          type: string
          nullable: true
        number:
          type: string
          nullable: true
        neighborhood:
          type: string
          nullable: true
        complement:
          type: string
          nullable: true

    EmpresaCompletaResponse:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/CnpjResponse'
        address:
          allOf:
            - $ref: '#/components/schemas/CepResponse'
          nullable: true
          description: Null if the company has no CEP on file or the CEP lookup failed.
        state:
          allOf:
            - $ref: '#/components/schemas/StateResponse'
          nullable: true
          description: Null if the company has no UF on file or the state lookup failed.
        warnings:
          type: array
          items:
            type: string
          description: Notes about any secondary lookup that was skipped or failed.

    CacheStats:
      type: object
      properties:
        hits:
          type: integer
          example: 42
        misses:
          type: integer
          example: 8
        entries:
          type: integer
          example: 3

    MetricsResponse:
      type: object
      properties:
        requests:
          type: integer
          example: 100
        successes:
          type: integer
          example: 94
        clientErrors:
          type: integer
          example: 4
        serverErrors:
          type: integer
          example: 2
        totalDurationMs:
          type: number
          example: 1250.45
        averageLatencyMs:
          type: number
          example: 12.5
        cache:
          $ref: '#/components/schemas/CacheStats'

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_CEP
            message:
              type: string
              example: CEP must contain 8 digits.
            details:
              type: object
              nullable: true

  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamError:
      description: An external provider failed or returned an unexpected response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamTimeout:
      description: An external provider did not respond in time
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        API key required for every /api/v1/* request. Each key is assigned a
        tier (free or paid) with its own rate limit; see README.md for
        configuration via API_KEYS_FREE / API_KEYS_PAID.
