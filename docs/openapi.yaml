openapi: 3.0.3
info:
  title: Brazil Data API
  description: >
    Unified REST API that aggregates Brazilian public/free data sources
    (postal codes, IBGE geographic data, national holidays and CNPJ company
    lookups) behind a single, consistent JSON interface.
  version: 0.1.0
  license:
    name: MIT
servers:
  - url: http://localhost:3000
    description: Local development

security:
  - ApiKeyAuth: []

tags:
  - name: Health
  - name: CEP
  - name: Locations
  - name: Holidays
  - name: CNPJ

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/cep/{cep}:
    get:
      tags: [CEP]
      summary: Look up an address by Brazilian postal code (CEP)
      parameters:
        - name: cep
          in: path
          required: true
          description: 8-digit CEP, with or without a hyphen (e.g. "69000000" or "69000-000")
          schema:
            type: string
            example: '69000000'
      responses:
        '200':
          description: Address found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CepResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/states:
    get:
      tags: [Locations]
      summary: List all Brazilian states
      responses:
        '200':
          description: List of states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/states/{uf}/cities:
    get:
      tags: [Locations]
      summary: List cities (municipalities) for a given state
      parameters:
        - name: uf
          in: path
          required: true
          description: 2-letter state code (e.g. "AM")
          schema:
            type: string
            example: AM
      responses:
        '200':
          description: List of cities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CityResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/holidays/{year}:
    get:
      tags: [Holidays]
      summary: List Brazilian national holidays for a given year
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
            example: 2026
      responses:
        '200':
          description: List of holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HolidayResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/cnpj/{cnpj}:
    get:
      tags: [CNPJ]
      summary: Look up a company by CNPJ
      parameters:
        - name: cnpj
          in: path
          required: true
          description: 14-digit CNPJ, with or without formatting punctuation
          schema:
            type: string
            example: '19131243000197'
      responses:
        '200':
          description: Company found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CnpjResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/empresa-completa/{cnpj}:
    get:
      tags: [CNPJ]
      summary: >
        Look up a company by CNPJ and enrich it with the full address (from
        its CEP) and full state name (from its UF) in a single call.
      description: >
        The CNPJ lookup is required: if it fails, the whole request fails
        with the same error/status the standalone /cnpj/{cnpj} endpoint
        would return. The address and state lookups are best-effort: if
        either fails, or the company record has no CEP/UF on file, that
        field is `null` in the response and a note is added to `warnings`
        instead of failing the request.
      parameters:
        - name: cnpj
          in: path
          required: true
          description: 14-digit CNPJ, with or without formatting punctuation
          schema:
            type: string
            example: '19131243000197'
      responses:
        '200':
          description: Company found (address/state may be null; see warnings)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpresaCompletaResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        uptimeSeconds:
          type: integer
        timestamp:
          type: string
          format: date-time

    CepResponse:
      type: object
      properties:
        cep:
          type: string
          example: '69000000'
        street:
          type: string
        neighborhood:
          type: string
        city:
          type: string
          example: Manaus
        state:
          type: string
          example: Amazonas
        stateCode:
          type: string
          example: AM

    StateResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Amazonas
        stateCode:
          type: string
          example: AM
        region:
          type: string
          example: Norte

    CityResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Manaus
        stateCode:
          type: string
          example: AM

    HolidayResponse:
      type: object
      properties:
        date:
          type: string
          example: '2026-01-01'
        name:
          type: string
          example: Confraternização mundial
        type:
          type: string
          example: national

    CnpjResponse:
      type: object
      properties:
        cnpj:
          type: string
        legalName:
          type: string
        tradeName:
          type: string
          nullable: true
        status:
          type: string
        openedAt:
          type: string
          nullable: true
        mainActivity:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        cep:
          type: string
          nullable: true
          description: Company's registered CEP, as returned by BrasilAPI (digits only).

    EmpresaCompletaResponse:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/CnpjResponse'
        address:
          allOf:
            - $ref: '#/components/schemas/CepResponse'
          nullable: true
          description: Null if the company has no CEP on file or the CEP lookup failed.
        state:
          allOf:
            - $ref: '#/components/schemas/StateResponse'
          nullable: true
          description: Null if the company has no UF on file or the state lookup failed.
        warnings:
          type: array
          items:
            type: string
          description: >
            Notes about any secondary (address/state) lookup that was
            skipped or failed. Empty when both succeeded.

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: INVALID_CEP
            message:
              type: string
              example: CEP must contain 8 digits.
            details:
              type: object
              nullable: true

  responses:
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamError:
      description: An external provider failed or returned an unexpected response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamTimeout:
      description: An external provider did not respond in time
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        API key required for every /api/v1/* request. Each key is assigned a
        tier (free or paid) with its own rate limit; see README.md for
        configuration via API_KEYS_FREE / API_KEYS_PAID.
